extra:
  # Support links. Leave a URL empty to hide it everywhere (banner, footer,
  # Support page); set it once the account is live.
  support:
    sponsors_url: "https://github.com/sponsors/realme72"
    ebook_url: ""      # e.g. https://leanpub.com/<book-slug>
    ebook_min_price: "$1"
    ebook_suggested_price: "$4.99"
  social:
